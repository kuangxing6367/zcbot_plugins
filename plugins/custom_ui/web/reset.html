<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZCBOT · 前端恢复</title>
<style>
  :root{
    --bg:#07080d;--surface:#10131d;--card:#0e1120;--border:#1c2133;--border2:#2a3048;
    --text:#e8ebf4;--muted:#8b93ad;--dim:#565e7a;--accent:#6366f1;--accent-l:#818cf8;
    --accent-soft:rgba(99,102,241,.14);--green:#22c55e;--red:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(ellipse 70% 50% at 50% 0%,#10132a 0%,var(--bg) 60%);
    color:var(--muted);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border2);
    border-radius:18px;padding:2rem 1.8rem;box-shadow:0 30px 80px -24px rgba(0,0,0,.8)}
  .badge{display:inline-flex;align-items:center;gap:.5rem;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:.72rem;letter-spacing:.1em;color:var(--accent-l);background:var(--accent-soft);
    border:1px solid rgba(99,102,241,.42);padding:.35rem .7rem;border-radius:8px;margin-bottom:1.2rem}
  h1{font-size:1.4rem;font-weight:800;color:var(--text);letter-spacing:-.02em;margin-bottom:.6rem}
  p{font-size:.9rem;line-height:1.8;color:var(--muted);margin-bottom:1.4rem}
  .steps{display:flex;flex-direction:column;gap:.8rem;margin-bottom:1.6rem}
  .step{display:flex;gap:.8rem;align-items:flex-start;font-size:.88rem;line-height:1.7;color:var(--muted)}
  .step b{color:var(--accent-l);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;
    background:var(--accent-soft);border:1px solid rgba(99,102,241,.3);border-radius:7px;
    padding:.05rem .45rem;flex-shrink:0;margin-top:.1rem}
  .field{margin-bottom:1rem}
  .field label{display:block;font-size:.78rem;color:var(--dim);margin-bottom:.4rem;letter-spacing:.03em}
  .field input{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:9px;
    padding:.7rem .85rem;color:var(--text);font-size:.92rem;outline:none;transition:border .2s}
  .field input:focus{border-color:var(--accent)}
  .actions{display:flex;gap:.8rem;margin-top:1.4rem}
  .btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;cursor:pointer;
    font-family:inherit;font-weight:600;font-size:.9rem;border-radius:10px;transition:all .2s;
    padding:.72rem 1rem;border:none}
  .btn-primary{background:linear-gradient(135deg,#6d6bf3,#4f46e5);color:#fff}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(99,102,241,.4)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--text)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
  .msg{margin-top:1rem;font-size:.85rem;line-height:1.7}
  .msg.ok{color:var(--green)}.msg.err{color:var(--red)}
  .hidden{display:none}
  .spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <span class="badge"><span style="width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block"></span> ZCBOT · RECOVERY</span>

  <!-- Step 1: 确认 -->
  <div id="step1">
    <h1>前端似乎出了问题？</h1>
    <p>检测到你在短时间内反复刷新了页面。可能是插件自定义的前端（custom_ui）出现了兼容或加载问题。</p>
    <div class="steps">
      <div class="step"><b>1</b>确认后，进入登录验证</div>
      <div class="step"><b>2</b>登录后即可恢复框架默认前端</div>
      <div class="step"><b>3</b>之后可重新启用插件再次个性化</div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="location.hash='#dismiss'">我再看一下</button>
      <button class="btn btn-primary" id="toLoginBtn" onclick="showLogin()">遇到问题，去恢复 →</button>
    </div>
    <div class="msg" id="step1Msg"></div>
  </div>

  <!-- Step 2: 登录 -->
  <div id="step2" class="hidden">
    <h1>验证管理员身份</h1>
    <p>为避免误操作，请登录管理员账号后恢复默认前端。</p>
    <div class="field"><label>用户名</label><input id="username" placeholder="管理员用户名"></div>
    <div class="field"><label>密码</label><input id="password" type="password" placeholder="密码" onkeydown="if(event.key==='Enter')doReset()"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="backToStep1()">返回</button>
      <button class="btn btn-primary" id="resetBtn" onclick="doReset()"><span id="resetBtnTxt">恢复默认前端</span></button>
    </div>
    <div class="msg" id="resetMsg"></div>
  </div>
</div>

<script>
// sessionStorage 标记"用户主动停留"，防止本页刷新又触发恢复流程
function markDismissed(){ try{ sessionStorage.setItem('zcbot_reset_dismissed','1') }catch(e){} }
function isDismissed(){ try{ return sessionStorage.getItem('zcbot_reset_dismissed')==='1' }catch(e){ return false } }

if(location.hash==='#dismiss'){ markDismissed(); history.replaceState(null,'',location.pathname); location.href='/' }

function showLogin(){ document.getElementById('step1').classList.add('hidden'); document.getElementById('step2').classList.remove('hidden'); document.getElementById('username').focus() }
function backToStep1(){ document.getElementById('step2').classList.add('hidden'); document.getElementById('step1').classList.remove('hidden') }

async function setResetBtn(busy, txt){
  const b=document.getElementById('resetBtn'), t=document.getElementById('resetBtnTxt')
  b.disabled=busy; t.textContent=txt
  if(busy){ t.parentElement.insertAdjacentHTML('beforeend','<span class="spinner" style="margin-left:4px"></span>') }
}
function showMsg(id,text,ok){
  const el=document.getElementById(id); el.textContent=text
  el.className='msg '+(ok?'ok':'err')
}

async function doReset(){
  const u=document.getElementById('username').value.trim()
  const p=document.getElementById('password').value
  if(!u||!p){ showMsg('resetMsg','请输入用户名和密码',false); return }
  showMsg('resetMsg','正在登录...',true)
  await setResetBtn(true,'处理中...')
  try{
    // 1. 登录获取 token
    const lr=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})})
    const ld=await lr.json()
    if(ld.code!==0){ showMsg('resetMsg',ld.msg||'登录失败',false); return }
    const token=ld.data.token
    // 2. 调用自定义恢复接口（启用该插件时由插件注册）
    const rr=await fetch('/api/custom_ui/reset',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'}})
    let rd
    try{ rd=await rr.json() }catch(e){ rd={code:-1} }
    if(rd.code===0){
      showMsg('resetMsg',rd.msg||'已恢复默认前端，正在跳转...',true)
      markDismissed()
      setTimeout(()=>{ location.href='/' },1200)
    } else if(rr.status===401){
      showMsg('resetMsg','登录已过期或接口需要鉴权，请稍后重试',false)
    } else if(rr.status===404||rr.status===405){
      showMsg('resetMsg','恢复接口不可用（custom_ui 插件可能已停用），可直接在后台插件管理禁用',false)
    } else {
      showMsg('resetMsg',rd.msg||'恢复失败，请重试',false)
    }
  }catch(e){ showMsg('resetMsg','网络错误：'+e.message,false) }
  finally{ await setResetBtn(false,'恢复默认前端') }
}
</script>
</body>
</html>
